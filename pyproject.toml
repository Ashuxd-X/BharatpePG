[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bharatpe-payment-plugin"
authors = [{ name = "AshuXD-X" }]
version = "0.1.0"
description = "Drop-in BharatPe UPI payment plugin for python-telegram-bot"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["bharatpe", "upi", "telegram", "bot", "payment", "india"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "python-telegram-bot[job-queue]>=20.0",
    "requests>=2.28",
    "Pillow>=9.0",
    "qrcode[pil]>=7.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]

[project.urls]
Homepage = "https://github.com/AshuXD-X/bharatpe-payment-plugin"
Documentation = "https://github.com/AshuXD-X/bharatpe-payment-plugin/blob/main/README.md"
"Bug Tracker" = "https://github.com/AshuXD-X/bharatpe-payment-plugin/issues"

[tool.setuptools.packages.find]
include = ["payment_plugin*"]
